<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM CHEATS - Secure Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* PREMIUM EMERALD & GOLD THEME */
            --bg-dark: #0A1F12;
            --primary-green: #10B981;
            --emerald-green: #059669;
            --gold-accent: #D4AF37;
            --gold-soft: #C9A227;
            --accent-mint: #6EE7B7;
            --laser-bright: #FBBF24; /* Gold Laser */
            --glass-bg: rgba(18, 40, 28, 0.85);
            --glass-border: rgba(212, 175, 55, 0.35);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body, html { 
            width: 100%; 
            height: 100%; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            color: #fff; 
            perspective: 1200px;
        }

        /* Dynamic 3D Cyber Matrix Grid */
        .cyber-grid {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(65deg);
            animation: gridMove 14s linear infinite;
            z-index: 1;
            will-change: transform;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) rotateX(65deg); }
            100% { transform: translateY(50px) rotateX(65deg); }
        }

        /* Glowing Ambient Orbs */
        .bg-glows {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }
        .glow-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: floatGlow 8s ease-in-out infinite alternate;
            will-change: transform;
        }
        .glow-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
            will-change: transform;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.2); }
        }

        /* Particle Canvas */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Outer Neon Glass Wrap */
        .container-wrapper {
            position: relative;
            z-index: 10;
            padding: 2px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--emerald-green), var(--gold-accent), var(--primary-green));
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.25);
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Glass Security Container */
        .security-container { 
            position: relative;
            text-align: center; 
            padding: 50px 40px; 
            background: var(--glass-bg);
            border-radius: 26px; 
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.95),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            max-width: 440px; 
            width: 90vw;
            overflow: hidden;
        }

        /* Dual Laser Scanner Line */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), var(--laser-bright), transparent);
            box-shadow: 0 0 25px var(--gold-accent);
            animation: scan 2.5s ease-in-out infinite;
            z-index: 12;
            will-change: top, opacity;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* HUD Corner Marks */
        .corner-accent {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: var(--gold-accent);
            border-style: solid;
            pointer-events: none;
            z-index: 11;
        }
        .top-left { top: 14px; left: 14px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
        .top-right { top: 14px; right: 14px; border-width: 2px 2px 0 0; border-top-right-radius: 6px; }
        .bottom-left { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; border-bottom-left-radius: 6px; }
        .bottom-right { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }

        /* Glowing Pulse Shield Icon */
        .icon-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            animation: rotateRing 10s linear infinite;
            will-change: transform;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }
        
        .shield-icon { 
            font-size: 52px; 
            background: linear-gradient(135deg, var(--gold-accent), var(--laser-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.8));
            animation: pulseShield 2s infinite ease-in-out; 
            z-index: 2;
            will-change: transform, filter;
        }
        
        @keyframes pulseShield { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6)); } 
            50% { transform: scale(1.1); filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.9)); } 
        }
        
        /* Typography */
        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 24px; 
            font-weight: 900;
            letter-spacing: 3px; 
            background: linear-gradient(180deg, #ffffff 0%, var(--accent-mint) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px; 
            text-transform: uppercase;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }
        
        p { 
            font-size: 13px; 
            color: var(--accent-mint); 
            opacity: 0.8;
            margin-bottom: 30px; 
            letter-spacing: 0.5px;
        }

        /* HUD Stats Bar */
        .hud-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            margin-bottom: 8px;
            color: var(--gold-accent);
        }

        .percentage-text {
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 12px var(--gold-accent);
        }
        
        /* Cyber Matrix Progress Bar */
        .loader-bar { 
            position: relative; 
            width: 100%; 
            height: 8px; 
            background: rgba(212, 175, 55, 0.1); 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
        }
        
        .loader-progress { 
            position: absolute; 
            top: 0; 
            left: 0; 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, var(--emerald-green), var(--gold-accent), var(--laser-bright)); 
            border-radius: 20px; 
            box-shadow: 0 0 20px var(--gold-accent); 
            transition: width 0.1s linear;
            will-change: width;
        }
        
        /* Terminal Status Box */
        .status-box {
            background: rgba(2, 11, 5, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 16px;
            border-radius: 10px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
        }

        .status-text { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 11px; 
            color: var(--gold-accent); 
            letter-spacing: 2px; 
            font-weight: 700; 
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 14px;
            background-color: var(--gold-accent);
            margin-left: 6px;
            box-shadow: 0 0 8px var(--gold-accent);
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 3D Cyber Matrix Grid Layer -->
    <div class="cyber-grid"></div>

    <!-- Ambient Matrix Glow Background -->
    <div class="bg-glows">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <!-- Matrix Constellation Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main Dynamic Card Container -->
    <div class="container-wrapper" id="tilt-card">
        <div class="security-container">
            <!-- HUD Line Accents -->
            <div class="scan-line"></div>
            <div class="corner-accent top-left"></div>
            <div class="corner-accent top-right"></div>
            <div class="corner-accent bottom-left"></div>
            <div class="corner-accent bottom-right"></div>

            <!-- Shield Icon Wrap -->
            <div class="icon-wrapper">
                <div class="icon-ring"></div>
                <div class="shield-icon"><i class="fa-solid fa-shield-halved"></i></div>
            </div>

            <h1>Security Check</h1>
            <p>Establishing encrypted connection...</p>
            
            <!-- Real-time HUD Metrics -->
            <div class="hud-stats">
                <span>SYSTEM STATUS</span>
                <span class="percentage-text" id="progress-percent">0%</span>
            </div>

            <!-- Animated Gold Bar -->
            <div class="loader-bar">
                <div class="loader-progress" id="progress-bar"></div>
            </div>

            <!-- Terminal Output -->
            <div class="status-box">
                <span class="status-text" id="status-string"></span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Terminal Typing & Progress Logic ---
        const statuses = [
            "INITIALIZING SECURE PROTOCOL...",
            "VERIFYING NODE NETWORK...",
            "DECRYPTING ENCRYPTED TOKEN...",
            "AUTHORIZING SYSTEM INJECTION...",
            "ACCESS GRANTED! REDIRECTING..."
        ];

        const totalDuration = 4500; // 4.5 Seconds (Smooth experience)
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const statusElement = document.getElementById('status-string');

        let startTime = null;
        let currentStatusIndex = -1;
        let typingTimeout = null;

        function typeWriter(text, i = 0) {
            if (i === 0) statusElement.innerText = "";
            if (i < text.length) {
                statusElement.innerText += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, i + 1), 20);
            }
        }

        function updateProgress(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min((elapsed / totalDuration) * 100, 100);

            // Update Progress UI smoothly
            progressBar.style.width = progress + "%";
            progressPercent.innerText = Math.floor(progress) + "%";

            // Dynamic Step Updates
            const statusStep = Math.min(
                Math.floor((progress / 100) * statuses.length), 
                statuses.length - 1
            );

            if (statusStep !== currentStatusIndex) {
                currentStatusIndex = statusStep;
                clearTimeout(typingTimeout);
                typeWriter(statuses[currentStatusIndex]);
            }

            if (elapsed < totalDuration) {
                requestAnimationFrame(updateProgress);
            } else {
                // Ensure final state is 100% before redirect
                progressBar.style.width = "100%";
                progressPercent.innerText = "100%";
                setTimeout(() => {
                    window.location.href = "shop.html";
                }, 300);
            }
        }

        requestAnimationFrame(updateProgress);

        // --- 2. Interactive Particle Canvas (High-Performance) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            // CSS size fixed
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            
            initParticles();
        }
        
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(resize, 150);
        });
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > window.innerWidth) this.x = 0;
                if (this.x < 0) this.x = window.innerWidth;
                if (this.y > window.innerHeight) this.y = 0;
                if (this.y < 0) this.y = window.innerHeight;
            }
            draw() {
                // Mix of Gold and Green particles
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(212, 175, 55, 0.6)' : 'rgba(16, 185, 129, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.strokeStyle = `rgba(16, 185, 129, ${1 - distance / 100 - 0.2})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((window.innerWidth * window.innerHeight) / 18000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            animationFrameId = requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Pause animation when tab is hidden to save battery
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(animationFrameId);
            } else {
                animateParticles();
            }
        });

        // --- 3. Smooth 3D Card Hover Tilt (Desktop Only) ---
        const tiltCard = document.getElementById('tilt-card');
        let requestId = null;

        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                if (requestId) cancelAnimationFrame(requestId);
                requestId = requestAnimationFrame(() => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                    tiltCard.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });
            });

            document.addEventListener('mouseleave', () => {
                if (requestId) cancelAnimationFrame(requestId);
                tiltCard.style.transition = 'transform 0.5s ease';
                tiltCard.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });

            document.addEventListener('mouseenter', () => {
                tiltCard.style.transition = 'none';
            });
        }
    </script>
</body>
</html>
